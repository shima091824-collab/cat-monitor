<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ねこモニター</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  /* 茶の間のテレビ（Fire TV）で見る、見るだけの画面。トークンはこのファイルに入れない（端末のブラウザに保存） */
  :root{--bg:#111;--panel:#1c1c1c;--fg:#f2f2f2;--muted:#9a9a9a;--ok:#2e9e5b;--warn:#c99a1c;--bad:#c0392b}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Noto Sans JP",sans-serif}
  #app{display:flex;height:100%}
  #map{flex:1 1 auto;height:100%}
  #side{width:30%;min-width:320px;box-sizing:border-box;padding:2.2vh 2vw;background:var(--panel);display:flex;flex-direction:column;gap:1.1vh}
  .title{font-size:2.8vh;color:var(--muted)}
  #status{border-radius:1.6vh;padding:1.4vh 1.2vw;font-size:3.9vh;font-weight:700;text-align:center}
  .ok{background:var(--ok)} .warn{background:var(--warn)} .bad{background:var(--bad)}
  .row{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid #333;padding-bottom:.8vh}
  .row .k{font-size:2.7vh;color:var(--muted)} .row .v{font-size:4vh;font-weight:700}
  #days{display:flex;gap:.8vw;align-items:center}
  #days button{flex:1;font-size:2.6vh;padding:1.2vh .4vw;border-radius:1vh;border:0;background:#333;color:#fff}
  #days button:focus{outline:4px solid #ffd54a}
  #dayLabel{font-size:3vh;font-weight:700;text-align:center}
  .past{color:#ffd54a}
  /* Fire TV のリモコン用：地図の上の大きなボタン（タッチもマウスもない端末で移動・拡大縮小） */
  #mapwrap{position:relative;flex:1 1 auto;height:100%}
  #mapwrap #map{position:absolute;inset:0}
  #pad{position:absolute;left:1.4vw;bottom:3vh;z-index:1000;display:grid;grid-template-columns:repeat(3,7vh);grid-template-rows:repeat(3,7vh);gap:.8vh}
  #zoom{position:absolute;right:1.4vw;bottom:3vh;z-index:1000;display:flex;flex-direction:column;gap:.8vh}
  #pad button,#zoom button{width:7vh;height:7vh;font-size:3.6vh;border-radius:1.2vh;border:0;background:rgba(20,20,20,.82);color:#fff;padding:0}
  #pad button:focus,#zoom button:focus{outline:4px solid #ffd54a}
  .tlabel{background:rgba(20,20,20,.85);color:#fff;border:0;border-radius:6px;font-size:1.7vh;font-weight:700;padding:2px 6px;box-shadow:none}
  .tlabel:before{display:none}
  .rlabel{position:absolute;transform:translate(-50%,-135%);white-space:nowrap;background:#fff;color:#2f6fd6;border:2px solid #6fa8ff;border-radius:999px;font-size:1.5vh;font-weight:700;padding:1px 8px}
  .note{font-size:2vh;color:var(--muted);line-height:1.35}
  #setup{position:fixed;inset:0;z-index:10000;box-sizing:border-box;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:3vh;padding:4vw;text-align:center}
  #setup input{box-sizing:border-box;font-size:3.6vh;width:100%;max-width:1200px;padding:1.6vh;border-radius:1vh;border:2px solid #555;background:#000;color:#fff}
  #setup button,#reset{font-size:3.6vh;padding:1.4vh 3vw;border-radius:1vh;border:0;background:#3a6fd8;color:#fff}
  #setup button:focus,#reset:focus,#setup input:focus{outline:4px solid #ffd54a}
  #reset,.resetlike{background:#333;font-size:1.9vh;padding:.7vh 1.2vw;border-radius:1vh;border:0;color:#fff}
  .resetlike:focus{outline:4px solid #ffd54a}
  .home{background:#3c5a78}
  .alarm{background:var(--bad);animation:blink 1s steps(2,start) infinite}
  @keyframes blink{to{background:#6d1a12}}
  /* 異常時の回転灯（10/27 オーナー指示。見本のイラストは素材サイトの画像のため使わず、同じ雰囲気の図を描いた） */
  #statusWrap{display:flex;align-items:center;gap:1vw}
  #statusWrap #status{flex:1}
  #sirenBox{display:none;width:10vh;flex:none}
  #sirenBox svg{width:100%;display:block}
  #siren .rays{animation:rays .6s ease-in-out infinite alternate}
  @keyframes rays{from{opacity:.15}to{opacity:1}}
  /* 10/27「電池58%が何かわかりづらい」→ 首輪（MT710）の電池と明記し、電池の形の目盛りを添える */
  .batt{position:relative;width:6.5vh;height:3.2vh;border:.4vh solid #ddd;border-radius:.6vh;box-sizing:border-box;padding:.3vh}
  .batt:after{content:'';position:absolute;right:-1.1vh;top:.8vh;width:.6vh;height:1vh;background:#ddd;border-radius:0 .3vh .3vh 0}
  /* 10/28 充電中は電池の絵を稲妻マークに変え、見出しを「充電中」にする（battery.charging.status：PLUG で true、UNPLUG・FULL で false［実測］） */
  .batt .bolt{display:none;position:absolute;left:50%;top:50%;width:3.4vh;height:3.4vh;transform:translate(-50%,-50%)}
  .batt.charging .bolt{display:block}
  .batt.charging #battFill{opacity:.35}
  #battK.charging{color:#ffd54a;font-weight:700}
  #battFill{display:block;height:100%;width:0;border-radius:.2vh;background:var(--ok)}
  /* 10/28 緊急確認の枠の下に、異常時の帯と回転灯の見本（小さく）を付ける */
  #sample{display:flex;flex-wrap:wrap;align-items:center;gap:.6vh .8vw;margin-top:.6vh}
  #sampleSiren{width:4.5vh;flex:none}
  #sampleSiren svg{width:100%;display:block}
  .sband{background:var(--bad);color:#fff;font-weight:700;font-size:1.6vh;padding:.3vh .6vw;border-radius:.8vh;white-space:nowrap}
  .slabel{font-size:1.6vh;color:var(--muted);white-space:nowrap}
  /* 10/28「確認しました」ボタン：その異常（最後の受信時刻で区別）を確認済みにして通常表示に戻す。新しい受信が来たら次の異常はまた出る。確認はこの端末だけ */
  #ackBtn{font-size:3vh;font-weight:700;padding:1.2vh 1vw;border-radius:1vh;border:0;background:#fff;color:#8b1d12}
  #ackBtn:focus{outline:5px solid #ffd54a}
  #alarmInfo{display:none;font-size:2.4vh;font-weight:700;color:#ffb3a8;line-height:1.4}
  .catdot.alarm-dot{box-shadow:0 0 0 10px rgba(192,57,43,.55),0 0 0 22px rgba(192,57,43,.25)}
  .catdot{width:26px;height:26px;border-radius:50%;background:#ff5a36;border:4px solid #fff;box-shadow:0 0 0 6px rgba(255,90,54,.35)}
  /* 10/30 スマホ（縦長・狭い画面）：リモコン用の大ボタンは隠して指で操作（ピンチで拡大）。文字は画面の高さ基準だと大きすぎるので px で決め、下へスクロールできるようにする */
  @media (max-width:800px){
    html,body{height:auto}
    #app{flex-direction:column;height:auto}
    #mapwrap{flex:none;height:52vh}
    #pad,#zoom{display:none}
    #side{width:100%;min-width:0;padding:12px 16px 24px;gap:8px}
    .title{font-size:14px}
    #status{font-size:20px;padding:10px 12px;border-radius:12px}
    .row{padding-bottom:6px}
    .row .k{font-size:14px} .row .v{font-size:20px}
    .batt{width:34px;height:17px;border-width:2px;padding:2px;border-radius:4px}
    .batt:after{right:-6px;top:4px;width:3px;height:6px}
    .batt .bolt{width:18px;height:18px}
    #bat{font-size:20px!important}
    #dayLabel{font-size:16px}
    #days button{font-size:14px;padding:10px 4px;border-radius:8px}
    .note{font-size:13px}
    #sirenBox{width:52px} #sampleSiren{width:24px}
    .sband,.slabel{font-size:12px}
    #ackBtn{font-size:18px;padding:12px}
    #alarmInfo{font-size:15px}
    #reset{font-size:13px;padding:8px 12px}
    .tlabel{font-size:12px} .rlabel{font-size:12px}
  }
</style>
</head>
<body>
<div id="app">
  <div id="mapwrap">
    <div id="map"></div>
    <div id="pad">
      <span></span><button id="up" title="上へ">▲</button><span></span>
      <button id="left" title="左へ">◀</button><button id="center" title="猫の位置へ" style="font-size:3vh">●</button><button id="right" title="右へ">▶</button>
      <span></span><button id="down" title="下へ">▼</button><span></span>
    </div>
    <div id="zoom"><button id="zin" title="拡大">＋</button><button id="zout" title="縮小">－</button></div>
  </div>
  <div id="side">
    <div class="title">ねこモニター（MT710）</div>
    <div id="statusWrap"><div id="sirenBox"><svg id="siren" viewBox="0 0 120 100" aria-hidden="true"><g class="rays" stroke="#ffcf2e" stroke-width="7" stroke-linecap="round"><line x1="14" y1="30" x2="28" y2="38"/><line x1="8" y1="58" x2="24" y2="58"/><line x1="30" y1="10" x2="38" y2="24"/><line x1="106" y1="30" x2="92" y2="38"/><line x1="112" y1="58" x2="96" y2="58"/><line x1="90" y1="10" x2="82" y2="24"/></g><path d="M36 78 V54 a24 24 0 0 1 48 0 V78 Z" fill="#e8231b" stroke="#5a0d08" stroke-width="3"/><path d="M44 56 a14 14 0 0 1 10 -16" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".85"/><rect x="28" y="76" width="64" height="12" rx="3" fill="#cfd4da" stroke="#5c6168" stroke-width="3"/><rect x="24" y="86" width="72" height="8" rx="2" fill="#9aa1a8" stroke="#5c6168" stroke-width="3"/></svg></div><div id="status" class="warn">読み込み中…</div></div>
    <div id="alarmInfo"></div>
    <button id="ackBtn" style="display:none">確認しました</button>
    <div class="row"><span class="k">最後の受信</span><span class="v" id="ago">—</span></div>
    <div class="row"><span class="k">位置の時刻</span><span class="v" id="ptime">—</span></div>
    <div class="row"><span class="k" id="battK">電池残量</span><span class="v" style="display:flex;align-items:center;gap:1vw"><span class="batt" id="battIcon"><span id="battFill"></span><svg class="bolt" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z" fill="#ffd54a" stroke="#1c1c1c" stroke-width="1.5" stroke-linejoin="round"/></svg></span><span id="bat">—</span></span></div>
    <div class="row"><span class="k">状態</span><span class="v" id="mov">—</span></div>
    <div id="dayLabel">今日の軌跡</div>
    <div id="days"><button id="prev">◀ 前の日</button><button id="today">今日</button><button id="next">次の日 ▶</button></div>
    <div class="note" id="help">線＝その日の動き（<span style="color:#ffb88c">■</span>早い→<span style="color:#8c140a">■</span>遅い時刻）。<span style="color:#7fb3ff">◯</span>＝家（中は線なし）。時刻は家の外の動き、拡大で増えます。0時に消えます（flespi に約1年残る）。</div>
    <div class="note" id="rule" style="color:#ffb3a8;border:1px solid #6d3a33;border-radius:1vh;padding:.6vh 1vw"><b>アラートのタイミング</b>：家（中心から30m）の外で、40分以上 受信なし（動きなし）のとき。<div id="sample"><span id="sampleSiren"></span><span class="sband">異常：家の外で◯分 動きなし</span><span class="slabel">←この表示</span></div></div>
    <div class="note" id="homeWarn" style="display:none;color:#ffd54a">家の位置を計算中のため、異常の判定はまだ止まっています。</div>
    <div style="display:flex;gap:1vw;margin-top:auto"><button id="reset">トークンを入れ直す</button></div>
  </div>
</div>
<div id="setup">
  <div style="font-size:4vh">はじめに flespi の「見るだけ」トークンを入力してください</div>
  <input id="tok" type="text" autocomplete="off" spellcheck="false" placeholder="トークン（64文字）">
  <div id="tokCount" style="font-size:4vh;font-weight:700;color:#ffd54a">入力済み 0 / 64 文字</div>
  <div id="tokShow" style="font-family:Menlo,Consolas,monospace;font-size:4.2vh;letter-spacing:.15em;line-height:1.5;word-break:break-all;max-width:1200px"></div>
  <div id="tokMsg" style="font-size:3.4vh;font-weight:700;color:#ff8a80;min-height:4vh"></div>
  <button id="save">保存して表示</button>
  <div class="note">トークンはこのテレビのブラウザの中だけに保存されます。</div>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const DEV=9194373, API='https://flespi.io/gw/devices/'+DEV, KEY='catmon.token';
const GREEN_MIN=3, RED_MIN=30;   // 最後の受信からの分数：3分以内＝緑、30分超＝赤、その間＝黄
const $=id=>document.getElementById(id);
function load(){try{return localStorage.getItem(KEY)||''}catch(e){return ''}}
function store(v){try{localStorage.setItem(KEY,v)}catch(e){}}
let token=load(); let mem='';
// URL の #t=... でも受け取れる（受け取ったら保存して URL から消す）
const m=location.hash.match(/t=([A-Za-z0-9]+)/); if(m){token=m[1];store(token);mem=token;history.replaceState(null,'',location.pathname)}
if(!token&&mem) token=mem;
function showSetup(){ $('setup').style.display='flex'; $('tok').focus() }
// 10/31 テレビで1文字違い（l と I）で弾かれた［実測］→ 全角は半角に直し、英数字以外は捨てる。
// 保存の前に flespi に確かめ、通らなければ見間違えやすい文字（l・I・1、O・0）を入れ替えて試す（最大64通り）
const norm=v=>v.replace(/[\uFF01-\uFF5E]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[^A-Za-z0-9]/g,'');
async function tokOk(t){ try{ const r=await fetch(API+'/telemetry/battery.level',{headers:{Authorization:'FlespiToken '+t}}); return r.ok }catch(e){ return false } }
async function findTok(v){
  const G={l:'lI1',I:'Il1','1':'1lI',O:'O0','0':'0O'}, pos=[]; for(let i=0;i<v.length;i++) if(G[v[i]]) pos.push(i);
  let cands=[v];
  for(const i of pos){ const next=[]; for(const c of cands) for(const ch of G[v[i]]) next.push(c.slice(0,i)+ch+c.slice(i+1)); if(next.length>64) break; cands=next }
  for(let k=0;k<cands.length;k++){ $('tokMsg').textContent='flespi に確認中… '+(k+1)+' / '+cands.length; if(await tokOk(cands[k])) return cands[k] }
  return null;
}
$('save').onclick=async()=>{
  const v=norm($('tok').value); if(v.length<20){ $('tokMsg').textContent='まだ '+v.length+' 文字です（64文字）'; return }
  const ok=await findTok(v);
  if(!ok){ $('tokMsg').textContent='このトークンは使えません。区切りごとに見比べてください（大文字・小文字も）'; return }
  $('tokMsg').textContent=''; $('tok').value=ok; token=ok; store(ok); $('setup').style.display='none'; tick(true)
};
$('tok').addEventListener('keydown',e=>{if(e.key==='Enter') $('save').click()});
// 10/31 テレビ内蔵ブラウザで「文字が入っているか判別できない」→ 入れた文字を8文字ずつ区切って大きく表示し、文字数も出す。
// 古いブラウザは入力のたびの通知が来ないことがあるので、0.3秒ごとに読み直す
function showTok(){ const v=norm($('tok').value); $('tokCount').textContent='入力済み '+v.length+' / 64 文字'; $('tokShow').textContent=(v.match(/.{1,8}/g)||[]).join(' ') }
setInterval(()=>{ if($('setup').style.display==='flex') showTok() },300);
$('reset').onclick=()=>{ $('tok').value=''; showSetup() };
// 家の位置：過去7日間に猫が10分以上じっとしていた場所（受信が10分以上止まる直前の位置）の中央値。
// 10/27 検証：オーナーと決めた「家と物置の中間」から4m、過去7日の家での40分超の空白25回はこの点から最大26m（30mで誤報0）［実測］。
// 座標をページに書かない（公開ページ）・端末ごとの入力も不要（テレビも同じ計算になる）。1時間ごとに計算し直す。
let HOME=null, homeAt=0;
async function updateHome(){
  if(Date.now()-homeAt<3600000&&HOME) return; homeAt=Date.now();
  const to=Math.floor(Date.now()/1000), r=await get('/messages?data='+encodeURIComponent(JSON.stringify({from:to-7*86400,to,fields:'timestamp,position.latitude,position.longitude,position.valid'})));
  const ok=x=>x['position.latitude']&&x['position.valid']!==false, rest=[]; let last=null;
  for(let i=0;i<r.length-1;i++){ if(ok(r[i])) last=r[i]; if(last&&r[i+1].timestamp-r[i].timestamp>=600&&r[i].timestamp-last.timestamp<1800) rest.push([last['position.latitude'],last['position.longitude']]) }
  if(rest.length<10) return;   // 記録が少ないうちは判定しない
  const med=a=>{const b=[...a].sort((x,y)=>x-y);return b[Math.floor(b.length/2)]};
  const h=L.latLng(med(rest.map(p=>p[0])),med(rest.map(p=>p[1])));
  if(!HOME||map.distance(HOME,h)>1){ HOME=h; if(isToday){ drawTrail(trailPts,trailTs); layoutTimes() } }
}
try{ localStorage.removeItem('catmon.home') }catch(e){}
$('sampleSiren').innerHTML=$('siren').outerHTML.replace('id="siren"','');   // 見本用に回転灯の図を複製   // 手入力していた頃の値を消す

const map=L.map('map',{zoomControl:false,attributionControl:true}).setView([35.68,139.76],5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const marker=L.marker([0,0],{icon:L.divIcon({className:'',html:'<div class="catdot"></div>',iconSize:[26,26],iconAnchor:[13,13]})});
const trailLayer=L.layerGroup().addTo(map);
// 家（その日いちばん長くいた場所）から HOME_M 以内は線を引かず、薄い円だけ描く（屋内の GPS のばらつきでトゲトゲになるため）
// 10/27 オーナー指摘「見栄えがよくない」→ ①円に出入りする線は円の縁で切る（円の中に線の切れ端を残さない）
// ②色はその日の外出の最初→最後で 薄→濃（0〜24時だと夕方だけの日は全部同じ色になった） ③前後3点の平均でギザギザをならす
const spanColor=t=>{const a=[255,184,140], b=[240,80,40], c=[140,20,10]; const m=(x,y,u)=>Math.round(x+(y-x)*u);
  const [p,q,u]=t<.5?[a,b,t*2]:[b,c,(t-.5)*2]; return 'rgb('+m(p[0],q[0],u)+','+m(p[1],q[1],u)+','+m(p[2],q[2],u)+')'};
const NCOL=8;   // 色の段階（線の本数＝段階数×外出回数。Fire TV の負荷を抑える）
function drawTrail(pts,ts){
  trailLayer.clearLayers(); if(!pts.length) return;
  const med=a=>{const b=[...a].sort((x,y)=>x-y);return b[Math.floor(b.length/2)]};
  const home=HOME||L.latLng(med(pts.map(p=>p[0])),med(pts.map(p=>p[1])));
  L.circle(home,{radius:HOME_M,color:'#6fa8ff',weight:2,opacity:.7,fill:true,fillColor:'#6fa8ff',fillOpacity:.07,dashArray:'4 8'}).addTo(trailLayer);
  // 家を原点にしたメートル座標（円との交点を求めるため）
  const kx=111320*Math.cos(home.lat*Math.PI/180), ky=110540;
  // 円の中に、中心から右の縁まで「←→ 20m」の寸法線を描く（10/27 オーナー指示）
  { const R=HOME_M, a=R*.18, w=R*.1, ll=(x,y)=>[home.lat+y/ky, home.lng+x/kx], st={color:'#2f6fd6',weight:2.5,opacity:.9,interactive:false};
    L.polyline([ll(0,0),ll(R,0)],st).addTo(trailLayer);
    L.polyline([ll(a,w),ll(0,0),ll(a,-w)],st).addTo(trailLayer);        // 左の矢じり
    L.polyline([ll(R-a,w),ll(R,0),ll(R-a,-w)],st).addTo(trailLayer);    // 右の矢じり
    L.marker(ll(R/2,0),{interactive:false,keyboard:false,icon:L.divIcon({className:'',html:'<div class="rlabel">'+R+'m</div>',iconSize:[0,0]})}).addTo(trailLayer); }
  const toXY=p=>[(p[1]-home.lng)*kx,(p[0]-home.lat)*ky], toLL=q=>[home.lat+q[1]/ky, home.lng+q[0]/kx];
  const edge=(a,b)=>{ // a（円の中）→ b（円の外）の線が円の縁と交わる点
    const A=toXY(a), B=toXY(b), dx=B[0]-A[0], dy=B[1]-A[1];
    const qa=dx*dx+dy*dy, qb=2*(A[0]*dx+A[1]*dy), qc=A[0]*A[0]+A[1]*A[1]-HOME_M*HOME_M;
    const t=(-qb+Math.sqrt(Math.max(0,qb*qb-4*qa*qc)))/(2*qa||1); return toLL([A[0]+dx*t,A[1]+dy*t]) };
  const isOut=pts.map(p=>map.distance(home,p)>=HOME_M);
  // 外にいる区間（外出）ごとに、前後3点の平均でならした線を作る
  const trips=[]; let cur=null;
  pts.forEach((p,i)=>{
    if(!isOut[i]){ if(cur){ cur.p.push(edge(p,cur.p[cur.p.length-1])); cur.t.push(ts[i]); trips.push(cur); cur=null } return }
    if(!cur){ cur={p:[],t:[]}; if(i>0){ cur.p.push(edge(pts[i-1],p)); cur.t.push(ts[i-1]) } }
    cur.p.push(p); cur.t.push(ts[i]);
  });
  if(cur) trips.push(cur);
  const outTs=trips.flatMap(r=>r.t); if(!outTs.length) return;
  const t0=Math.min(...outTs), t1=Math.max(...outTs), span=Math.max(1,t1-t0);
  for(const r of trips){
    const P=r.p.map((p,i,a)=>{ if(i===0||i===a.length-1) return p;   // 両端（円の縁）は動かさない
      return [(a[i-1][0]+p[0]+a[i+1][0])/3,(a[i-1][1]+p[1]+a[i+1][1])/3] });
    let k0=0, c0=Math.min(NCOL-1,Math.floor((r.t[0]-t0)/span*NCOL));
    for(let i=1;i<=P.length;i++){
      const c=i<P.length?Math.min(NCOL-1,Math.floor((r.t[i]-t0)/span*NCOL)):-1;
      if(c!==c0){ L.polyline(P.slice(k0,i+(i<P.length?1:0)),{color:spanColor((c0+.5)/NCOL),weight:4.5,opacity:.95,lineJoin:'round',lineCap:'round'}).addTo(trailLayer); k0=i; c0=c }
    }
  }
}
let first=true, lastServer=0;
let trailDay=0, trailPts=[], trailTs=[], trailLast=0, viewDay=null, isToday=true;
// 軌跡に時刻の目印（10/27 オーナー指摘：家の周りで札が重なる → 減らしすぎ → もう少し出したい）
// その日いちばん長くいた場所（緯度・経度の中央値）から HOME_M 以内は札を付けない（最初と最後の点は除く）。
// 外では LABEL_MIN 分ごとに候補を作り、画面上で既に置いた札と重なるものだけ省く。拡大すると札が増える。
const HOME_M=20, LABEL_MIN=0.5;   // 10/27 19:00 家の円を半径60m→20mに（オーナー指示）   // 10/27：2分→30秒（拡大しても札が増えないとの指摘。間引きは画面上の重なりで行う）
const lblSize=()=>{const f=window.innerHeight*0.017; return [f*3.3+14, f*1.5+6]};   // 札の大きさ（.tlabel の文字 1.7vh に合わせる）
const timeLayer=L.layerGroup().addTo(map);
let tPts=[], tTs=[];
function drawTimes(pts,ts){ tPts=pts; tTs=ts; layoutTimes() }
function layoutTimes(){
  const pts=tPts, ts=tTs; timeLayer.clearLayers(); if(!pts.length) return;
  const med=a=>{const b=[...a].sort((x,y)=>x-y);return b[Math.floor(b.length/2)]};
  const home=HOME||L.latLng(med(pts.map(p=>p[0])),med(pts.map(p=>p[1])));
  const cand=[0,pts.length-1]; let last=-1e12;
  pts.forEach((p,i)=>{ if(i===0||i===pts.length-1) return; if(map.distance(home,p)<HOME_M) return;
    if(ts[i]-last>=LABEL_MIN*60){ cand.push(i); last=ts[i] } });
  const boxes=[];
  for(const i of cand){
    const [W,H]=lblSize(); const pt=map.latLngToContainerPoint(pts[i]); const bx=[pt.x-W/2,pt.y-H-6,pt.x+W/2,pt.y-6];
    if(boxes.some(q=>bx[0]<q[2]&&bx[2]>q[0]&&bx[1]<q[3]&&bx[3]>q[1])) continue;
    boxes.push(bx);
    L.circleMarker(pts[i],{radius:4,color:'#fff',weight:2,fillColor:'#ff5a36',fillOpacity:1}).bindTooltip(hm(ts[i]),{permanent:true,direction:'top',offset:[0,-4],className:'tlabel'}).addTo(timeLayer);
  }
}
map.on('zoomend',layoutTimes);

const WD='日月火水木金土';
function dayText(d){ const t=new Date((d+9*3600)*1000); return (t.getUTCMonth()+1)+'/'+t.getUTCDate()+'('+WD[t.getUTCDay()]+')' }
function showDayLabel(){ const l=$('dayLabel'); if(viewDay===null) return; if(isToday){l.textContent='今日 '+dayText(viewDay)+' の軌跡';l.className=''} else {l.textContent=dayText(viewDay)+' の軌跡（過去）';l.className='past'} $('next').disabled=isToday }
async function loadPast(d){
  // 過去の日：その日の 0:00〜24:00 をまとめて読み、全体が見えるように地図を合わせる
  $('dayLabel').textContent=dayText(d)+' を読み込み中…';
  const msgs=await get('/messages?data='+encodeURIComponent(JSON.stringify({from:d,to:d+86399,fields:'timestamp,position.latitude,position.longitude,position.valid'})));
  const ok=msgs.filter(x=>x['position.latitude']&&x['position.valid']!==false);
  const pts=ok.map(x=>[x['position.latitude'],x['position.longitude']]);
  drawTrail(pts,ok.map(x=>x.timestamp)); drawTimes(pts,ok.map(x=>x.timestamp)); if(pts.length) map.fitBounds(L.latLngBounds(pts),{padding:[40,40],maxZoom:18});
  showDayLabel(); if(!pts.length) $('dayLabel').textContent=dayText(d)+'：記録なし';
}
async function goDay(delta){
  if(!token) return; const today=jstMidnight();
  let d=(delta===0)?today:(viewDay??today)+delta*86400; if(d>today) d=today;
  viewDay=d; isToday=(d===today);
  try{
    if(isToday){ trailDay=0; await tick(true) } else await loadPast(d);
  }catch(e){ $('dayLabel').textContent='読み込みに失敗しました'; if(window.__diagShow) window.__diagShow('goDay: '+e.message) }
}
// 地図の移動（画面の 1/3 ずつ）と拡大縮小、猫の位置へ戻る
const panBy=(fx,fy)=>{const z=map.getSize(); map.panBy([z.x*fx/3,z.y*fy/3])};
$('up').onclick=()=>panBy(0,-1); $('down').onclick=()=>panBy(0,1); $('left').onclick=()=>panBy(-1,0); $('right').onclick=()=>panBy(1,0);
$('zin').onclick=()=>map.zoomIn(); $('zout').onclick=()=>map.zoomOut();
$('center').onclick=()=>{ if(map.hasLayer(marker)) map.setView(marker.getLatLng(),Math.max(map.getZoom(),16)) };
$('prev').onclick=()=>goDay(-1); $('next').onclick=()=>goDay(1); $('today').onclick=()=>goDay(0);
document.addEventListener('keydown',e=>{ if($('setup').style.display==='flex') return; if(e.key==='ArrowLeft'&&document.activeElement.tagName!=='BUTTON'){goDay(-1)} if(e.key==='ArrowRight'&&document.activeElement.tagName!=='BUTTON'){goDay(1)} });
function jstMidnight(){ const n=Math.floor(Date.now()/1000), j=n+9*3600; return n-(j%86400) }   // 日本時間の今日 0:00（UNIX 秒）

async function get(path){
  const r=await fetch(API+path,{headers:{Authorization:'FlespiToken '+token}});
  if(r.status===401||r.status===403) throw new Error('auth');
  if(!r.ok) throw new Error('http '+r.status);
  return (await r.json()).result||[];
}
// 10/31 テレビ（Firefox 34）は toLocaleTimeString の指定を無視して秒まで出した［オーナー報告］→ 日本時間の HH:MM を自前で作る
const hm=t=>{const d=new Date((t+9*3600)*1000), p=n=>(n<10?'0':'')+n; return p(d.getUTCHours())+':'+p(d.getUTCMinutes())};
function agoText(s){ if(s<60) return Math.max(0,Math.round(s))+'秒前'; if(s<3600) return Math.floor(s/60)+'分前'; return Math.floor(s/3600)+'時間'+Math.floor(s%3600/60)+'分前' }
// 異常の判定（10/27 オーナーと決定）：家の中心から ALARM_M の外で、ALARM_MIN 分以上受信なし＝動けないなどのトラブルの可能性。
// MT710 は静止すると送信を止めるので「受信なし」≒「動いていない」。過去8日の家での40分超の空白37回は、中心から最大28m（30mで誤報0回）。
// 地図の円（HOME_M=20m）は見た目用、判定は ALARM_M=30m。家の中で受信なしは正常（寝ている）なので赤にしない。
const ALARM_M=30, ALARM_MIN=40, LOWBAT=15;
let ackServer=0; try{ ackServer=+localStorage.getItem('catmon.ack')||0 }catch(e){}
$('ackBtn').onclick=()=>{ ackServer=lastServer; try{localStorage.setItem('catmon.ack',String(lastServer))}catch(e){} paint() };
let lastPos=null, lastPosTs=0, lastBat=null, onCharger=false;
function paint(){
  if(!lastServer) return;
  const s=Date.now()/1000-lastServer, mins=s/60, st=$('status'), info=$('alarmInfo');
  $('ago').textContent=agoText(s);
  $('homeWarn').style.display=HOME?'none':'block';
  const dist=(HOME&&lastPos)?Math.round(map.distance(HOME,lastPos)):null, out=dist!=null&&dist>ALARM_M;
  const dot=document.querySelector('.catdot'); let alarm=false; info.style.display='none';
  if(mins<=GREEN_MIN){st.className='ok';st.textContent='受信中'}
  else if(onCharger){st.className='home';st.textContent='充電器につながっています'}
  else if(dist!=null&&!out){st.className='home';st.textContent='家で休んでいます'}
  else if(out&&mins>=ALARM_MIN&&ackServer===lastServer){st.className='warn';st.textContent='確認済み：家の外で'+Math.floor(mins)+'分 受信なし'}
  else if(out&&mins>=ALARM_MIN){
    alarm=true; st.className='alarm'; st.textContent='異常：家の外で'+Math.floor(mins)+'分 動きなし';
    info.style.display='block';
    info.innerHTML='最後の場所：家から約'+dist+'m（'+hm(lastPosTs)+'）＝地図の赤い点'+
      (lastBat!=null&&lastBat<=LOWBAT?'<br>電池'+lastBat+'%：電池切れの可能性あり':'');
  }
  else if(out){st.className='warn';st.textContent='家の外で受信なし '+Math.floor(mins)+'分'}
  else if(mins<=RED_MIN){st.className='warn';st.textContent='しばらく受信なし'}
  else {st.className='bad';st.textContent='長い間 受信なし'}
  if(dot) dot.classList.toggle('alarm-dot',alarm);
  const ab=$('ackBtn'), wasHidden=ab.style.display==='none'; ab.style.display=alarm?'block':'none'; if(alarm&&wasHidden) ab.focus();   // リモコンの決定ボタンですぐ押せるように
  $('sirenBox').style.display=alarm?'block':'none';
  $('help').style.display=alarm?'none':''; $('reset').style.display=alarm?'none':''; $('rule').style.display=alarm?'none':'';   // 異常中は帯と回転灯そのものが出ているので、説明の枠は隠して画面に収める   // 異常のときは説明文を隠して、右欄を画面に収める
}
async function tick(force){
  if(!token){showSetup();return}
  try{
    await updateHome().catch(()=>{});
    const t=(await get('/telemetry/position.latitude,position.longitude,position.valid,timestamp,server.timestamp,battery.level,battery.voltage,battery.charging.status,event.code'))[0];
    const tel=(t&&t.telemetry)||{}; const v=k=>tel[k]&&tel[k].value;
    lastServer=v('server.timestamp')||v('timestamp')||0;
    const lat=v('position.latitude'), lon=v('position.longitude');
    if(lat&&lon){
      lastPos=L.latLng(lat,lon); lastPosTs=tel['position.latitude'].ts;
      marker.setLatLng([lat,lon]); if(!map.hasLayer(marker)) marker.addTo(map);
      if((first||force)&&isToday){map.setView([lat,lon],17);first=false}
      $('ptime').textContent=tel['position.latitude']?((tel['position.latitude'].ts<jstMidnight()?dayText(tel['position.latitude'].ts-((tel['position.latitude'].ts+9*3600)%86400)).replace(/\(.\)/,'')+' ':'')+hm(tel['position.latitude'].ts)):'—';
    }
    const b=v('battery.level'); lastBat=b;
    const chg=v('battery.charging.status')===true;
    // 10/29 満充電（FULL）になると充電器につないだままでも charging.status＝false が届く［実測：10/29 20:40 100%・4.187V で false］→ 40分後に誤報。
    // 最後の受信が 100%・4.15V以上なら充電器の上とみなす（外せば送信が再開し、電圧も下がる）
    const full=!chg&&b>=100&&(v('battery.voltage')||0)>=4.15; onCharger=chg||full;
    $('battIcon').classList.toggle('charging',chg); $('battK').classList.toggle('charging',chg); $('battK').textContent=chg?'充電中':(full?'充電完了':'電池残量');
    // 10/28：充電中の MT710 は満充電（FULL）まで何も送らない［実測：10/26 07:36〜09:28 送信なし→FULL 100%］。
    // つないだ直後の％は充電器の電圧で高く出る（36%→4分後61%、3.72V→3.87V［実測］）ので、充電中は％の代わりに開始時刻を出す
    const chgTs=tel['battery.charging.status']&&tel['battery.charging.status'].ts;
    $('bat').textContent=chg&&chgTs?hm(chgTs)+'から':(b!=null?b+'%':'—'); $('bat').style.fontSize=chg?'3vh':'';
    if(b!=null){ const f=$('battFill'); f.style.width=Math.max(0,Math.min(100,b))+'%'; f.style.background=b<=LOWBAT?'var(--bad)':(b<=40?'var(--warn)':'var(--ok)') }
    const ev=v('event.code'); $('mov').textContent=ev==='STILL'?'静止':(ev==='AUTO'?'移動中':(ev||'—'));
    // 軌跡：今日を見ているときは 0:00 から、2回目からは前回の続きだけ読む。日付が変わったら今日に切り替えて描き直す
    const day0=jstMidnight();
    if(viewDay===null||(viewDay===trailDay&&day0!==trailDay&&viewDay>=day0-86400&&isToday)) viewDay=day0;
    isToday=(viewDay===day0);
    if(isToday){
      if(trailDay!==day0){trailDay=day0; trailPts=[]; trailTs=[]; trailLast=day0-1; timeLayer.clearLayers(); trailLayer.clearLayers()}
      const msgs=await get('/messages?data='+encodeURIComponent(JSON.stringify({from:trailLast+1,fields:'timestamp,position.latitude,position.longitude,position.valid'})));
      for(const x of msgs){ if(x.timestamp>trailLast) trailLast=x.timestamp; if(x['position.latitude']&&x['position.valid']!==false){ trailPts.push([x['position.latitude'],x['position.longitude']]); trailTs.push(x.timestamp) } }
      if(msgs.length||!timeLayer.getLayers().length){ drawTrail(trailPts,trailTs); drawTimes(trailPts,trailTs) }
    }
    showDayLabel();
    paint();
  }catch(e){
    if(e.message==='auth'){ $('status').className='bad'; $('status').textContent='トークンが使えません'; showSetup() }
    else { $('status').className='bad'; $('status').textContent='通信エラー（再試行中）'; if(window.__diagShow) window.__diagShow('tick: '+e.message) }   // テレビ用の診断表示（tv.html のみ）
  }
}
// 10/27 「電池の残り」行は削除（オーナー：休んでいる間は減り方が変わり当てにならない）
tick(); setInterval(tick,10000); setInterval(paint,1000);
</script>
